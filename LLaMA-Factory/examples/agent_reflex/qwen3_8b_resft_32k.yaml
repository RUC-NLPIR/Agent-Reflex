### Agent-Reflex ReSFT: Qwen3-8B full-parameter SFT on the RSD corpus.
### Paper setting: 2 nodes x 8 GPUs, global batch 32, 3 epochs = 5127 steps.
### Paths are relative to the LLaMA-Factory root; model/output are overridden by
### scripts/train_resft.sh (MODEL_PATH / OUTPUT_DIR).

### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json
gradient_checkpointing: true

### dataset
dataset_dir: data
dataset: agent_reflex_resft
template: qwen3
cutoff_len: 32768
max_samples: 54663
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 2

### output
output_dir: saves/qwen3-8b-agent-reflex-resft
logging_steps: 5
save_strategy: steps
save_steps: 313
save_total_limit: 20
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 7.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.1
bf16: true
tf32: true
ddp_timeout: 180000000
seed: 42
data_seed: 42
